name: Deploy VIP 27 to InfinityFree

on:
  push:
    branches: [main]
    paths:
      - 'VIP27-InfinityFree-Deployment.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract application package
        run: |
          test -f VIP27-InfinityFree-Deployment.zip
          mkdir -p deploy-root
          unzip -q VIP27-InfinityFree-Deployment.zip -d deploy-root
          test -f deploy-root/.htaccess
          test -f deploy-root/public/index.php
          test -f deploy-root/database/schema.sql

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, fileinfo, mbstring
          coverage: none

      - name: Validate PHP syntax
        run: |
          find deploy-root -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run smoke tests
        run: php deploy-root/tests/smoke.php

      - name: Deploy over explicit FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          security: strict
          local-dir: deploy-root/
          server-dir: /htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/.env
            **/public/uploads/**
            **/storage/logs/**
            **/storage/cache/**
